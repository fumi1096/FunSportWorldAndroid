name: Bug report
description: 报告可复现的问题（不要提交真实账号或 token）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认：这是 FunSportWorld 的 Android 二次开发版本，非官方客户端。
        **不要**在 Issue 中填写真实手机号、密码、验证码、token、Cookie 或截图中的个人信息。
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置/关于页显示的版本，例如 1.1.3 (5)
      placeholder: "1.1.3 (5)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: "Pixel 7 / Android 15 / 官方系统"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 看到…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志/截图
      description: 请先打码账号、手机号、token 等敏感信息。
    validations:
      required: false

