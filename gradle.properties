org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# Parallel execution and file watching are disabled: the constrained Windows
# sandbox used to build this project cannot initialize Gradle's file watcher,
# and the Kotlin plugin hit a state-lock race with parallel configuration
# resolution. Serial execution is slower but deterministic.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
